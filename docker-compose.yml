services:
  postgres:
    image: postgres:16
    container_name: sara_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sara_user
      POSTGRES_PASSWORD: sara_password
      POSTGRES_DB: sara_db
    ports:
      - "5432:5432"
    volumes:
      - sara_pg_data:/var/lib/postgresql/data

  # Servidor de e-mail de desenvolvimento: captura tudo o que o SARA envia.
  # Caixa de entrada em http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: sara_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  sara_pg_data: